spring.application.name=tienda

spring.datasource.url=jdbc:mysql://localhost:3307/thezone?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=8080

tienda.jwt.secreto=cambiar-esta-clave-por-una-de-al-menos-32-caracteres-en-produccion
tienda.jwt.duracion-minutos=120

tienda.cors.origenes=http://localhost:[*],http://127.0.0.1:[*]

tienda.semillas.activas=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
